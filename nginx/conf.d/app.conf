# ==========================================================
# Alpha India Nginx Configuration for ipodesk.shop
# ==========================================================

# Upstream services
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# ----------------------------------------------------------
# 1. HTTP Server (Port 80)
# Handles ACME challenge for Let's Encrypt SSL renewal
# and redirects all other traffic to HTTPS
# ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ipodesk.shop www.ipodesk.shop api.ipodesk.shop;

    # Let's Encrypt ACME challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_set_header Host $host;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------
# 2. Direct API Port 8000 (HTTP Fallback / Direct Ingestion)
# ----------------------------------------------------------
server {
    listen 8000;
    server_name ipodesk.shop api.ipodesk.shop localhost;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}

# ----------------------------------------------------------
# 3. HTTPS Server for API Subdomain (api.ipodesk.shop)
# ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ipodesk.shop;

    ssl_certificate /etc/letsencrypt/live/ipodesk.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipodesk.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}

# ----------------------------------------------------------
# 4. HTTPS Server for Main Web App (ipodesk.shop & www.ipodesk.shop)
# ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ipodesk.shop www.ipodesk.shop;

    ssl_certificate /etc/letsencrypt/live/ipodesk.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipodesk.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static assets cache optimization
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # Direct Health Check Passthrough
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API Proxy for backend services (/api/growth-screener, /api/market-intelligence, etc.)
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # WebSocket connection proxy
    location /ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Next.js Frontend Server
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
