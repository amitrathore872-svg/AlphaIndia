[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-india-backend"
version = "2.3.1"
description = "Institutional AI Growth Scanner & Financial Radar for Indian Equities (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alpha India Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "SQLAlchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "python-dotenv>=1.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
