name: Deploy to Production EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure only one deployment runs at a time on the EC2 server, cancelling superseded runs
concurrency:
  group: production-ec2-deployment
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Auto Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Remote Deployment via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          set -e
          # Sanitize inputs (strip trailing whitespace, tabs, and newlines)
          CLEAN_USER=$(echo "$SSH_USER" | tr -d ' \t\r\n')
          CLEAN_HOST=$(echo "$SSH_HOST" | tr -d ' \t\r\n')
          CLEAN_PORT=$(echo "$SSH_PORT" | tr -d ' \t\r\n')

          if [ -z "$CLEAN_USER" ]; then
            CLEAN_USER="ec2-user"
          fi

          echo "=========================================="
          echo "Target Host: $CLEAN_HOST"
          echo "Target User: $CLEAN_USER"
          echo "Target Port: $CLEAN_PORT"
          echo "=========================================="

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Format and save private key
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add remote host key to known_hosts
          ssh-keyscan -p "$CLEAN_PORT" -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          # Execute remote continuous deployment pipeline
          ssh -i ~/.ssh/deploy_key -p "$CLEAN_PORT" -o StrictHostKeyChecking=accept-new "$CLEAN_USER@$CLEAN_HOST" '
            set -e
            echo "=========================================="
            echo "=== Pre-flight Server Disk Space Check ==="
            echo "=========================================="
            df -h / || true

            # Emergency reclaim of disk space in case previous builds filled root volume
            docker builder prune -a -f 2>/dev/null || true
            docker image prune -a -f 2>/dev/null || true
            docker system prune -a -f --volumes=false 2>/dev/null || true
            sudo journalctl --vacuum-time=1d 2>/dev/null || sudo journalctl --vacuum-size=10M 2>/dev/null || true
            sudo find /var/lib/docker/containers/ -name "*-json.log" -size +5M -exec truncate -s 1M {} + 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || sudo yum clean all 2>/dev/null || true
            sudo rm -rf /var/cache/apt/archives/* /tmp/* /var/tmp/* /var/log/*.gz /var/log/*.[0-9] 2>/dev/null || true

            # Purge any host node_modules or .next caches that may have been created outside Docker
            rm -rf "$HOME/AlphaIndia/frontend/node_modules" "$HOME/AlphaIndia/frontend/.next" 2>/dev/null || true
            rm -rf "/home/ec2-user/AlphaIndia/frontend/node_modules" "/home/ec2-user/AlphaIndia/frontend/.next" 2>/dev/null || true
            rm -rf "/home/ubuntu/AlphaIndia/frontend/node_modules" "/home/ubuntu/AlphaIndia/frontend/.next" 2>/dev/null || true

            # Auto-grow filesystem in case EBS volume was modified in AWS Console
            sudo growpart /dev/nvme0n1 1 2>/dev/null || sudo growpart /dev/xvda 1 2>/dev/null || true
            sudo resize2fs /dev/nvme0n1p1 2>/dev/null || sudo resize2fs /dev/xvda1 2>/dev/null || sudo xfs_growfs / 2>/dev/null || true

            echo "=== Disk Space After Pre-flight Cleanup ==="
            df -h / || true

            DEPLOY_PATH="$HOME/AlphaIndia"
            if [ ! -d "$DEPLOY_PATH" ]; then
              if [ -d "/home/ec2-user/AlphaIndia" ]; then
                DEPLOY_PATH="/home/ec2-user/AlphaIndia"
              elif [ -d "/home/ubuntu/AlphaIndia" ]; then
                DEPLOY_PATH="/home/ubuntu/AlphaIndia"
              else
                echo "Error: Directory AlphaIndia not found in home folder."
                exit 1
              fi
            fi

            echo "Target Directory: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            echo "=== Syncing repository to latest origin/main ==="
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/*.sh
            ./scripts/deploy_update.sh
          '

      - name: Verify Service Health Check
        run: |
          echo "Verifying backend health endpoint via production domain..."
          sleep 8
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "https://ipodesk.shop/health" || echo "000")
          echo "HTTPS /health status code: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Production deployment verification successful (200 OK)!"
          else
            echo "Direct /health check returned $STATUS_CODE."
          fi

      - name: Capture and Publish Diagnostics
        if: always()
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          CLEAN_USER=$(echo "$SSH_USER" | tr -d ' \t\r\n')
          CLEAN_HOST=$(echo "$SSH_HOST" | tr -d ' \t\r\n')
          CLEAN_PORT=$(echo "$SSH_PORT" | tr -d ' \t\r\n')
          [ -z "$CLEAN_USER" ] && CLEAN_USER="ec2-user"
          mkdir -p ~/.ssh && echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$CLEAN_PORT" -o StrictHostKeyChecking=accept-new "$CLEAN_USER@$CLEAN_HOST" '
            cd "$HOME/AlphaIndia" || cd "/home/ec2-user/AlphaIndia" || cd "/home/ubuntu/AlphaIndia"
            echo "=== DISK STATUS ===" > /tmp/deploy_diag.txt
            df -h / >> /tmp/deploy_diag.txt 2>&1
            echo "=== DOCKER DISK USAGE ===" >> /tmp/deploy_diag.txt
            docker system df >> /tmp/deploy_diag.txt 2>&1
            echo "=== GIT STATUS ===" >> /tmp/deploy_diag.txt
            git log -n 3 --oneline >> /tmp/deploy_diag.txt 2>&1
            echo "=== DOCKER PS ===" >> /tmp/deploy_diag.txt
            docker compose ps >> /tmp/deploy_diag.txt 2>&1
            echo "=== DOCKER COMPOSE LOGS (BACKEND) ===" >> /tmp/deploy_diag.txt
            docker compose logs --tail=120 backend >> /tmp/deploy_diag.txt 2>&1
            echo "=== DOCKER COMPOSE LOGS (DB) ===" >> /tmp/deploy_diag.txt
            docker compose logs --tail=50 db >> /tmp/deploy_diag.txt 2>&1
            echo "=== DOCKER COMPOSE LOGS (NGINX) ===" >> /tmp/deploy_diag.txt
            docker compose logs --tail=50 nginx >> /tmp/deploy_diag.txt 2>&1
          ' || true
          scp -i ~/.ssh/deploy_key -P "$CLEAN_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$CLEAN_USER@$CLEAN_HOST:/tmp/deploy_diag.txt" ./deploy_diag.txt 2>/dev/null || true
          if [ -f "./deploy_diag.txt" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B deploy-diag
            git add deploy_diag.txt || true
            git commit -m "chore: record deployment diagnostics" || true
            timeout 30 git push -f origin deploy-diag || true
          fi
